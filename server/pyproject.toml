[project]
name = "ctx-manager-server"
version = "0.1.0"
description = "Python MCP server for advanced context management with ML-powered importance scoring, interconnectedness analysis, and active learning"
authors = [
  { name = "Context Manager Team" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "context", "importance", "machine-learning", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "mcp[cli]>=2.0.0, <3.0",
  "scikit-learn>=1.5.0, <2.0",
  "numpy>=1.26.0, <3.0",
  "pyyaml>=6.0.3, <7.0",
  "networkx>=3.3, <4.0",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0.0, <4.0",
  "torch>=2.0.0",
]
dev = [
  "pytest>=9.0.0, <10.0",
  "ruff>=0.5.0, <1.0",
  "mypy>=1.10.0, <2.0",
]

[project.scripts]
ctx-server = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203", "E266", "E501", "F403", "F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
